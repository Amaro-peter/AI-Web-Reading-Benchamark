# SonarQube analysis configuration.
# Run with: npm run quality:sonar  (requires a local server + SONAR_TOKEN)

sonar.projectKey=ai-web-reading-benchmark
sonar.projectName=AI Web Reading Benchmark
sonar.projectVersion=0.1.0

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/tests,e2e
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,backend/tests/fixtures/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

# Coverage produced by `npm run coverage` (Vitest + v8 provider, lcov reporter)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Quality goals documented in the README:
#   coverage >= 80%, duplication <= 3%,
#   cognitive complexity <= 15, cyclomatic complexity <= 10, technical debt <= 5%
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,backend/tests/fixtures/**
